[package]
name = "band-game"
version = "0.1.0"
edition = "2021"
default-run = "band-game"

[[bin]]
name = "band-game"
path = "src/main.rs"

[[bin]]
name = "render"
path = "src/bin/render.rs"

[dependencies]
axum = "0.8.9"
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http = { version = "0.7.1", features = ["fs"] }
uuid = { version = "1.29.1", features = ["v4", "serde"] }
band-render = { path = "../renderer" }

# Audio rendering is far too slow unoptimized (the preset test took minutes), so dev builds and
# tests are optimized too: our own code lightly, to keep rebuilds quick, and dependencies fully,
# as they are built once and cached.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
