[package]
name = "band-render"
version = "0.1.0"
edition = "2021"
description = "The canonical renderer: orders -> Web Audio graph -> WAV. Used by the server, and compiled to WebAssembly for the browser (renderer/wasm)."

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
# Offline rendering only: no audio device (cpal), which also keeps it buildable for WebAssembly.
web-audio-api = { version = "1.7.0", default-features = false }

[dev-dependencies]
serde_json = "1.0.154"
