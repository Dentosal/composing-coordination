[package]
name = "band-render-wasm"
version = "0.1.0"
edition = "2021"
description = "The renderer (band-render) for the browser: built by tools/build-wasm.sh into client/wasm/renderer.wasm."

[lib]
crate-type = ["cdylib"]

[dependencies]
band-render = { path = ".." }
serde_json = "1.0.154"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
